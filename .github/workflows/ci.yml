name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on high or critical advisories in the whole tree, dev tools
      # included, since they run in this pipeline and in the Docker build
      # (PCI DSS 6.3, #176). Moderate and low ones are reviewed by hand.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit tests with the minimum coverage of vitest.config.ts (RNF07, #77)
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

      # First-load JS/CSS of the storefront routes (RNF10, #78)
      - name: Performance budget
        run: npm run perf:budget
