# Atelier Bureau — local server (issue #7, ARCHITECTURE.md section 5.1)
# Start everything: docker compose up -d
# Other devices on the LAN open https://<SITE_HOST>
# Every service has `restart: unless-stopped` and a healthcheck (#80);
# the uptime panel is at https://<SITE_HOST>:3001 (LAN only)

name: atelier-bureau

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Uptime panel (#80), LAN only: the Caddyfile refuses public IPs
      - "3001:3001"
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Root certificate exported for the devices on the network
      - ./deploy/certs:/certs
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://atelier_app:${MYSQL_APP_PASSWORD}@db:3306/atelier_bureau
      # The Prisma CLI only negotiates TLS with sslaccept; the container
      # certificate is self-signed, so the chain is not checked (#221)
      MIGRATION_DATABASE_URL: mysql://atelier_migrate:${MYSQL_MIGRATE_PASSWORD}@db:3306/atelier_bureau?sslaccept=accept_invalid_certs
      # Key of the CPF and phone encryption at rest (RNF03)
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
    volumes:
      # Uploaded product images, datasheets and attachments (#22)
      - ./storage:/app/storage
    # Not published: only reachable through the proxy
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    # Same probe as the Dockerfile HEALTHCHECK, explicit here: the route
    # also runs SELECT 1 on MySQL, so a lost database marks it unhealthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: mysql:8.4
    restart: unless-stopped
    # Only this machine by default. Docker Desktop shows every connection
    # through the published port as the Docker gateway, so MySQL cannot
    # tell LAN clients apart: open it to the LAN only on purpose, with
    # MYSQL_PUBLISH_ADDR=0.0.0.0 (ARCHITECTURE.md 5.1)
    ports:
      - "${MYSQL_PUBLISH_ADDR:-127.0.0.1}:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # root only from inside the container, never remote
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: atelier_bureau
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
      MYSQL_MIGRATE_PASSWORD: ${MYSQL_MIGRATE_PASSWORD:?set MYSQL_MIGRATE_PASSWORD in .env}
      MYSQL_DEV_PASSWORD: ${MYSQL_DEV_PASSWORD:-}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD:?set MYSQL_BACKUP_PASSWORD in .env}
      LAN_SUBNET: ${LAN_SUBNET:-192.168.0.%}
    # Server settings as flags: a bind-mounted .cnf is world-writable on
    # Windows hosts and MySQL ignores it
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --tls-version=TLSv1.2,TLSv1.3
      # TCP connections without TLS are refused (RNF16, #221); the
      # socket inside the container (healthcheck, restore) is not TCP
      - --require-secure-transport=ON
      - --max-connections=200
      # Lets the migration user (no SUPER) create the triggers with the
      # binary log on (prisma/migrations/20261115000000_database_triggers)
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backup:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      # Optional push monitor of the uptime panel (#80)
      BACKUP_PUSH_URL: ${BACKUP_PUSH_URL:-}
    volumes:
      - ./backups:/backups
      - ./deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh", "--daemon"]
    depends_on:
      db:
        condition: service_healthy
    # Daemon loop alive and last backup not failed
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/backup.sh", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Uptime panel and alerts (#80, RNF01). Reached only through the proxy
  # at https://<SITE_HOST>:3001; the monitors and the e-mail alert are
  # set up in its web UI (docs/AtelierBureau_Monitoramento.md)
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: exposes only the Mercado Pago webhook route to the internet
  # (#57). docker compose --profile tunnel up -d
  # The gate forwards only POST /api/webhooks/mercadopago to the app; the
  # tunnel is alone with the gate on the `tunnel` network, so it reaches
  # nothing else. Public hostname in Cloudflare: http://webhook-gate:8080
  webhook-gate:
    image: caddy:2
    profiles: ["tunnel"]
    restart: unless-stopped
    volumes:
      - ./deploy/caddy/Caddyfile.webhook:/etc/caddy/Caddyfile:ro
    networks:
      - default
      - tunnel
    depends_on:
      app:
        condition: service_healthy
    # Local-only listener of Caddyfile.webhook (the tunnel cannot reach it)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    # Metrics server inside the container only, used by the healthcheck
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - tunnel
    depends_on:
      - webhook-gate
    # The image has no shell: `cloudflared tunnel ready` asks the metrics
    # server whether the tunnel has an active connection to Cloudflare
    healthcheck:
      test:
        [
          "CMD",
          "cloudflared",
          "tunnel",
          "--metrics",
          "127.0.0.1:20241",
          "ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # Only the tunnel and the webhook gate
  tunnel:

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
  uptime-kuma-data:
